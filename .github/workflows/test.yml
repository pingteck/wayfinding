name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run every mechanical gate
        # Plain bash + git + POSIX tools; passes on GNU (here) and BSD (macOS) userlands.
        run: bash tests/run-all.sh
